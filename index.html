<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Politics Geography Quiz</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Game Interface (visible from start, map loads here) -->
        <div id="game-interface" class="game-interface">
            <div class="info-panel">
                <div class="target-city">
                    Find: <span id="target-person-name">---</span>
                </div>
                <div class="game-stats">
                    <div class="stat">
                        <span class="label">Streak:</span>
                        <span id="streak-number">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Best:</span>
                        <span id="high-score">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Mastered:</span>
                        <span id="mastery-percent">0%</span>
                    </div>
                    <div class="stat">
                        <span class="label">Time:</span>
                        <span id="timer-display" style="font-variant-numeric: tabular-nums;">00:00.000</span>
                    </div>
                    <button id="change-mode-btn" class="change-mode-btn">Change Mode</button>
                </div>
            </div>
            <div class="mastery-progress">
                <div id="mastery-progress-fill" class="mastery-progress-fill"></div>
            </div>

            <div id="map"></div>

            <div class="result-panel hidden" id="result-panel">
                <div id="result-message" class="result-message"></div>
                <div id="result-distance" class="result-distance"></div>

                <hr>

                <div class="sidebar-info">
                    <div><strong id="result-label">Senator:</strong> <span id="result-name"></span></div>
                    <div id="state-container"><strong>State:</strong> <span id="result-state"></span></div>
                    <div id="party-container"><strong>Party:</strong> <span id="result-party"></span></div>
                    <div id="since-container"><strong>In Office Since:</strong> <span id="result-since"></span></div>
                    <div id="confidence-container"><strong>Confidence:</strong> <span id="result-confidence"></span></div>

                    <!-- Person Image Container -->
                    <div id="person-image-container" style="margin: 12px 0; display: none;">
                        <img id="person-image" src="" alt=""
                            style="width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
                    </div>

                    <div id="result-fact" class="fun-fact" style="margin-top: 8px; font-style: italic;"></div>

                    <div style="margin-top: 8px;">
                        <a id="result-wiki-link" href="#" target="_blank"
                            style="color: #1a73e8; text-decoration: none;">
                            📖 Learn more on Wikipedia →
                        </a>
                    </div>

                    <div id="leaving-note" class="leaving-note hidden">* Not serving the next term</div>
                </div>

                <div class="result-actions">
                    <button id="btn-next" class="next-btn">Next Target</button>
                </div>
            </div>
        </div>

        <!-- Game Mode Selection (overlays the map) -->
        <div id="mode-selection" class="mode-selection">
            <h1>US Politics Geography Quiz</h1>
            <p>Test your knowledge of American politics!</p>
            <div class="mode-buttons">
                <button id="senators-btn" class="mode-btn">US Senators</button>
                <button id="governors-btn" class="mode-btn">Governors</button>
            </div>
        </div>

        <!-- Post Game / Leaderboard Screen -->
        <div id="post-game-screen" class="mode-selection hidden">
            <h1>Run Complete!</h1>
            <p id="final-time-display" style="font-size: 1.2rem; color: #f6c90e; margin-bottom: 24px; font-weight: bold;"></p>

            <div class="leaderboard-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Score</th>
                            <th>Initials</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>

            <div id="initials-entry" class="initials-entry hidden">
                <p>New Leaderboard Entry!</p>
                <div class="input-group">
                    <input type="text" id="player-initials" maxlength="3" placeholder="AAA" autocomplete="off" oninput="this.value = this.value.toUpperCase()">
                    <button id="submit-score-btn" class="mode-btn">Submit</button>
                </div>
            </div>

            <button id="play-again-btn" class="mode-btn" style="margin-top: 24px;">Play Again</button>
        </div>

        <!-- Stale-data notice (shown only if the data predates the most recent election) -->
        <div id="stale-notice" class="stale-notice hidden" role="status">
            <span id="stale-notice-text"></span>
            <button id="stale-notice-close" class="stale-notice-close" aria-label="Dismiss">×</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Game Script -->
    <script src="script.js"></script>
</body>

</html>
